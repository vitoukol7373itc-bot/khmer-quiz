 if(!list.length||list.length>20||list.some(x=>!/^[A-Z]{2}$/.test(x))){DS.err='Enter 1 to 20 two-letter country codes, for example KH.';render();return}
 const go=()=>dsAct('admin_set_setting',{p_key:'geo_allowed',p_value:[...new Set(list)]},'',async()=>{await plRpc('admin_set_setting',{p_key:'geo_mode',p_value:mode});DS.ok='Country settings saved.'+(mode==='block'?' Blocking only takes effect once middleware.js is deployed on Vercel.':'');await v17Rel()});
 if(mode==='block')cfm('Block visitors from other countries?','Real students who use a VPN or whose location is wrong will be blocked, and so will search engines and you when travelling. Try <b>Report only</b> first.','Turn blocking on',go);else go()}
function v17Boot(){try{if(location.pathname.replace(/\/+$/,'')==='/admin'){V17.adm=true;view='dash';scr='';const m=document.createElement('meta');m.name='robots';m.content='noindex,nofollow';document.head.appendChild(m);document.title='Admin'}}catch(e){}v17Land()}
function v17After(){if(V17.adm&&PL.sess)dsInit()}

function v17Ended(){if(!PL.sess)return;offClear();const cloud=typeof clUser=='function'&&clUser();PL.sess=null;PL.admin=false;plSaveSess();
 if(cloud){CL.mem=null;CL.pays=null;pauseAll();name='';uid='';adm=false;edit=false;scr='';view='home';try{localStorage.removeItem('ifl_uid')}catch(e){}}
 else if(view=='plmine'||view=='pladm')view='plib';
 msg='';render();setTimeout(()=>alert('You were signed out: your session ended, your password was changed, or the account was suspended. Sign in again, or contact the administrator if you cannot.'),50)}

/* ===== r29: practise offline (signed-in members). Rules are kept on the server; this only remembers the last answer. ===== */
const OFFK='cl_ent',OFFQ='cl_oq',OFFL='cl_oql',OFFDAYS=7,OFFKEEP=30;
const offNet=e=>navigator.onLine===false||/Failed to fetch|NetworkError|Load failed|network request failed/i.test(String((e&&e.message)||e||''));
const offEm=()=>PL.sess&&PL.sess.user?String(PL.sess.user.email||'').toLowerCase():'';
function offSave(){try{const m=CL.mem,em=offEm();if(!m||!em||m.offline||!m.state)return;
 localStorage.setItem(OFFK,JSON.stringify({e:em,at:Date.now(),m:{state:m.state,enforcement:m.enforcement,trial_ends_at:m.trial_ends_at,membership_ends_at:m.membership_ends_at,membership_plan:m.membership_plan,membership_source:m.membership_source,name:m.name,free_limited:!!(m.free_time&&m.free_time.limited)}}))}catch(x){}}
function offLoad(){try{const em=offEm(),c=JSON.parse(localStorage.getItem(OFFK)||'null');return c&&em&&c.e===em&&c.m?c:null}catch(x){return null}}
function offClear(){try{localStorage.removeItem(OFFK)}catch(x){}}
/* the server could not be reached: work out, from what it last told us, whether this member may practise */
function offRestore(){const c=offLoad(),now=Date.now();
 if(!c||now-c.at>OFFDAYS*864e5||c.at>now+36e5){CL.mem={state:'expired',has_access:false,enforcement:'on',offline:true,trial_days_left:0,why:c?'old':'none'};return false}
 const m=c.m,tEnd=m.trial_ends_at?Date.parse(m.trial_ends_at):0,mEnd=m.membership_ends_at?Date.parse(m.membership_ends_at):0;let st=m.state;
 if(st==='member'&&!(mEnd>now))st=tEnd>now?'trial':'expired';if(st==='trial'&&!(tEnd>now))st='expired';
 const enf=m.enforcement==='on',ok=st!=='suspended'&&st!=='none'&&(!enf||st==='member'||st==='trial');
 CL.mem={state:st,has_access:ok,enforcement:m.enforcement,trial_ends_at:m.trial_ends_at,membership_ends_at:m.membership_ends_at,membership_plan:m.membership_plan,membership_source:m.membership_source,name:m.name,email:c.e,
  trial_days_left:Math.max(0,Math.ceil((tEnd-now)/864e5)),membership_days_left:Math.max(0,Math.ceil((mEnd-now)/864e5)),offline:true,free_time:m.free_limited?{limited:true,left:0}:undefined,until:c.at+OFFDAYS*864e5};return ok}
const offIsOff=()=>!!clUser()&&(navigator.onLine===false||!!(CL.mem&&CL.mem.offline));
function offGate(){if(!offIsOff()||!CL.mem||CL.mem.has_access!==false)return false;snd('err');msg='📡 '+offWhy();scr='';render();scrollTo(0,0);return true}
function offWhy(){const m=CL.mem||{};return m.why==='old'?'You have been offline for more than '+OFFDAYS+' days, so your membership cannot be confirmed. Connect to the internet to continue.':m.why==='none'?'This device has not confirmed your membership yet. Connect to the internet once, then you can practise offline.':m.state==='suspended'?'This account is suspended. Connect to the internet and contact the administrator.':'Offline practice is for active members and free-trial users. Connect to the internet to continue, or choose a membership.'}
/* results made offline wait here, then are sent to the server when the internet is back */
function offQ(){try{const q=JSON.parse(localStorage.getItem(OFFQ)||'[]');return Array.isArray(q)?q:[]}catch(x){return[]}}
function offPutQ(q){try{localStorage.setItem(OFFQ,JSON.stringify(q.slice(-200)))}catch(x){}}
const offN=()=>{const em=offEm();return em?offQ().filter(x=>x.e===em).length:0};
function offEnqueue(t,s,a,secs,cid){const em=offEm();if(!em||a.oqk)return;a.oqk='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
 const q=offQ().filter(x=>Date.now()-x.at<OFFKEEP*864e5);q.push({k:a.oqk,e:em,t:t.id,tn:t.n,s:s.id,sn:s.n||s.t||'',tot:s.qs.length,sc:a.sc||0,n:scA(a,s)[1],secs:secs||0,cid:cid||null,at:Date.now()});offPutQ(q);save();try{if(view!=='test')render()}catch(x){}}
function offDrop(k){offPutQ(offQ().filter(x=>x.k!==k))}
let OFFLUSH=false;
async function offFlush(){if(OFFLUSH||!clUser()||!PL.sess||navigator.onLine===false)return;const em=offEm();if(!offQ().some(x=>x.e===em))return;
 try{const l=+localStorage.getItem(OFFL)||0;if(Date.now()-l<45000)return;localStorage.setItem(OFFL,String(Date.now()))}catch(x){}
 OFFLUSH=true;let done=0;
 try{for(const k of offQ().filter(x=>x.e===em).map(x=>x.k)){const it=offQ().find(x=>x.k===k);if(!it)continue;
   try{if(!it.cid){it.cid=await plRpc('attempt_start',{p_test_id:it.t,p_test_name:it.tn,p_section_id:it.s,p_section_name:it.sn,p_total:it.tot});offPutQ(offQ().map(x=>x.k===k?it:x))}
    await plRpc('attempt_finish',{p_id:it.cid,p_score:it.sc,p_answered:it.n,p_duration_s:it.secs});offDrop(k);done++}
   catch(e){const m=String(e&&e.message||e);if(offNet(e)||m.includes('not_authenticated'))break;if(m.includes('account_suspended')){clSuspended();break}offDrop(k)}}}
 finally{OFFLUSH=false;try{localStorage.removeItem(OFFL)}catch(x){}}
 if(done)offRe()}
function offRe(){const a=document.activeElement;if(view==='test'||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))return;try{render()}catch(x){}}
function offBanner(){if(!offIsOff())return '';const m=CL.mem||{},n=offN();
 return m.has_access===false?`<div class="trb end" role="status"><span>📡 <b>You are offline.</b> ${esc(offWhy())}</span></div>`
 :`<div class="trb" role="status" style="background:#eef2ff"><span>📡 <b>You are offline.</b> Keep practising: your results are saved on this device and sent when the internet is back${n?' ('+n+' waiting)':''}.</span></div>`}
const offPill=()=>offIsOff()?'<span class="plan" title="No internet">📡 Offline</span>':'';
window.addEventListener('online',()=>{offFlush();if(clUser()){clLoad(false).then(()=>{offFlush();offRe()}).catch(()=>{})}else offRe()});
window.addEventListener('offline',()=>offRe());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)offFlush()});

v17Boot();migA();render();clBoot();v17After();
</script>
