ng sleep, the brain organizes what we learned during the day, making it easier to recall later.","qs":[],"parts":[{"id":"pmv36x2gk18rsu","n":"Grammar","h":"","p":"","tm":0,"hid":false,"qs":[{"q":"The coffee you are having ______. May I have one for myself, too?","o":["smells good","smells well","smell good","is smelling good"],"a":0,"e":"Form: Subject + linking verb (smell, look, taste, feel, sound) + adjective."},{"q":"I wish you ______ the trouble to me before so I could help you.","o":["explained","had explained","didn't explain","hadn't explained"],"a":1,"e":"Form: Subject + wish + subject + had + V3.  *Grammar: Past regret with wish."},{"q":"The local cinema is losing business since most people in the town ______ to the bigger cinema at the shopping mall outside of town.","o":["must have gone","ought to go","would rather go","could be going"],"a":2,"e":"Form: Subject + would rather + V1 + than + V1.  *Grammar: Would rather (expressing preference)."},{"q":"The ear is the organ of hearing, but it also plays a role in ______ balance.","o":["maintained","it maintains","to maintain","maintaining"],"a":3,"e":"Form: Preposition + V-ing.   *Grammar: Gerund after a preposition."},{"q":"We had better ______ this chapter carefully because we will have some questions on it on our test tomorrow.","o":["to review","reviewing","that reviewing","review"],"a":3,"e":"Form: Subject + had better + V1.  *Grammar: Had better (advice or recommendation)."},{"q":"Of the two new teachers, one is experienced and ______.","o":["the other is not","another is inexperienced","the others are not","other lacks experience"],"a":0,"e":"Form: Of the two + plural noun, one + clause + and the other + clause.   *Grammar: The other (the second of two people or things)."},{"q":"Natural resources provide the raw materials ______ to produce finished goods.","o":["needed","which need","are needed","needing"],"a":0,"e":"Form: Noun + V3 + additional information.  *Grammar: Reduced passive relative clause."},{"q":"There is evidence that prehistoric humans used fire ______ 4,000,000 B.C.","o":["so","as early as","as early as","so early that"],"a":1,"e":"Form: As early as + time/date.  *Grammar: Expressions of time."},{"q":"Not only ______ shade and beauty, but they also reduce carbon dioxide.","o":["do trees provide","trees provide","provide trees","trees do provide"],"a":0,"e":""},{"q":"If you press that button, what ______?","o":["would happen","happened","would have happened","will happen"],"a":3,"e":"Form: If + subject + V1, subject + will + V1. *Grammar: First Conditional."},{"q":"If you had caught the bus, you ______ late for work.","o":["wouldn't have been","would have been","would be","wouldn't be"],"a":0,"e":"Form: If + subject + had + V3, subject + would not have + V3.  *Grammar: Third Conditional."},{"q":"I don't know what happened to my bag, but I suppose it ______.","o":["must have stolen","has been stealing","could have been stolen","should have stolen"],"a":2,"e":"Form: Subject + could have been + V3.  *Grammar: Modal perfect passive (possibility in the past)."},{"q":"______ today, in some societies the world is thought to be flat.","o":["Since","Even","Already","For"],"a":1,"e":"Form: Even + time expression or phrase + main clause.  *Grammar: Emphasis using even."},{"q":"In 1959, the political philosopher Hannah Arendt became the first woman ______ a full professor at Princeton University.","o":["to appoint","was appointed","to be appointed","an appointment as"],"a":2,"e":""},{"q":"There is almost ______ vegetation in the Badlands, a barren region of South Dakota.","o":["not","no","none","nor"],"a":1,"e":""},{"q":"There has not been a great response to the sale, ______?","o":["does there","hasn't there","hasn't it","has there"],"a":3,"e":""},{"q":"Public television stations are different from commercial stations ______.","o":["in the areas of funding and programming","for money and program types","because they receive money differently and different types of shows","because the former receives money and has programs differently from the latter"],"a":0,"e":"Form: Subject + be different from + noun + in + areas/aspects.   *Grammar: Parallel structure."},{"q":"Do you know how tall ______?","o":["is the giraffe of Africa","is the Africa of giraffe","the Africa of giraffe is","the giraffe of Africa is"],"a":3,"e":""},{"q":"One of the professor's greatest attributes is ______.","o":["when he gives lectures","his ability to lecture","the way to give lectures","how in the manner that he lectures"],"a":1,"e":"Form: Subject + be + noun phrase.  *Grammar: Noun phrase and infinitive of ability."},{"q":"San Francisco has a pleasant climate, ______ and many fascinating neighbourhoods.","o":["the scenery is exciting","that the scenery is exciting","exciting scenery","has exciting scenery"],"a":1,"e":"Form: Noun phrase + noun phrase + and + noun phrase.  *Grammar: Parallel structure."},{"q":"Insects provide many beneficial services, such as ______, breaking down deadwood, and pollinating plants.","o":["they condition soils","to condition soil","conditioning the soil","soil conditioned"],"a":2,"e":"Form: Such as + V-ing, V-ing, and V-ing.   *Grammar: Parallel gerunds."},{"q":"Fruit is one of the most abundant, nutritious, and ______ foods a person can eat.","o":["tastes delicious","too delicious","is it delicious","delicious"],"a":3,"e":"Form: Adjective + adjective + and + adjective + noun.  *Grammar: Parallel adjectives."},{"q":"The National Road, ______ of the first highways in North America, connected the East Coast to the Ohio Valley.","o":["one","it was one","which one","was one"],"a":0,"e":"Form: Noun + comma + noun phrase + comma + main clause.   *Grammar: Appositive phrase."},{"q":"The plane ______ landing at the airport in five minutes.","o":["it is","it really is","is descending","will be"],"a":2,"e":"Form: Subject + am/is/are + V-ing.  *Grammar: Present Continuous."},{"q":"Nars ______ two episodes of that new TV show.","o":["has already filmed","already filmed","has already been filming","already films"],"a":2,"e":"Form: Subject + has/have + already + V3.  *Grammar: Present Perfect."},{"q":"Savuth can't join us tomorrow afternoon because he ______ his aunt in hospital.","o":["is visiting","will visit","shall visit","visits"],"a":0,"e":"Form: Subject + am/is/are + V-ing + future time expression.   *Grammar: Present Continuous for future arrangements."},{"q":"While he was finishing off the kitchen, I ______ the bedroom walls.","o":["had painted","had been painting","have been painting","was painting"],"a":3,"e":"Form: While + subject + was/were + V-ing, subject + was/were + V-ing.  *Grammar: Past Continuous for simultaneous past actions."},{"q":"Sarah can play ______ guitar. She actually can be a music teacher.","o":["a","an","—","the"],"a":3,"e":"Form: Play + the + musical instrument.   *Grammar: Articles with musical instruments"},{"q":"Landmines from the legacy of war in the past are still threatening Laotian people. These landmines were ______ by warring parties at that time.","o":["laid","laid","lay","lain"],"a":0,"e":"Form: Subject + was/were + V3.   *Grammar: Past Simple Passive."},{"q":"The doctor insisted that his patient ______.","o":["take it easy for three months","taking it easy inside of three months","to take some vacations for three months","that he not work too hard for three months"],"a":0,"e":"Form: Subject + insist + that + subject + V1.  *Grammar: Subjunctive mood."},{"q":"We talked about ______ books. Jim had just finished ______ last volume of Odyssey.","o":["the, a","—, the","the, the","an, a"],"a":1,"e":"Form: Plural noun used generally (no article) + the + specific noun.   *Grammar: Zero article and definite article."},{"q":"Our salary has not been ______ even by a small amount in the last five years although inflation is crushing us.","o":["risen","rose","raised","arisen"],"a":2,"e":"Form: Subject + has/have + been + V3.  *Grammar: Present Perfect Passive."},{"q":"On Jupiter the winds have created storms ______ big that astronomers on Earth can see them through their telescopes.","o":["how","such","as","so"],"a":2,"e":"Form: So + adjective/adverb + that + clause.  *Grammar: So...that (result)."},{"q":"Mr. Duncan does not know ______ the lawn mower after they had finished using it. ","o":["where did they put","where they put","where they did put","where to put"],"a":1,"e":"Form: Question word + subject + verb.   *Grammar: Indirect questions."},{"q":"There were two small rooms in the beach house, ______ served as a kitchen.","o":["smallest of that","the smallest of which","the smaller of them","the smaller of which"],"a":3,"e":"Form: Noun + comma + the + comparative adjective + of which + verb.   *Grammar: Relative clauses with of which."},{"q":"Last year, Makara earned ______ his brother, who has a better position.","o":["twice as much","twice more than","the smaller of them","twice as much as"],"a":3,"e":"Form: Subject + verb + twice as much as + noun/pronoun.  *Grammar: Comparison of quantity."},{"q":"New question","o":["eight-centuries-old","old-eight-centuries","eight-century-old","eight-century's-old"],"a":2,"e":"Form: Number + singular noun + adjective + noun.   *Grammar: Compound adjectives."},{"q":"______ continental crust older than 200 million years.","o":["It is nowhere the","Nowhere is the","Is the nowhere","Nowhere is is the"],"a":1,"e":"Form: Negative adverb + auxiliary verb + subject + main verb.   *Grammar: Inversion after a negative adverb."},{"q":"Four miles off the southeastern coast of Massachusetts ______, a popular summer resort.","o":["does lie the island of Martha's Vineyard","the island of Martha's Vineyard lies there","lies the island of Martha's Vineyard","where the island of Martha's Vineyard lies"],"a":2,"e":"Form: Place expression + verb + subject.  *Grammar: Inversion with place expressions."},{"q":"A number of reporters from different news outlets ______ at the conference yesterday.","o":["were","had been","was","being have"],"a":0,"e":"Form: A number of + plural noun + plural verb.    *Grammar: Subject–verb agreement."}],"k":"q","i":"📝","items":[],"t":"Part 1 — Grammar"},{"id":"pmv36x2gkrq64v","n":"Vocabulary","h":"","p":"","tm":0,"hid":false,"qs":[{"q":"She was known for being extremely [u]meticulous[/u] when preparing reports, checking every number twice.","o":["very fast","very confident","very generous","very careful and precise"],"a":3,"e":"Form: Subject + be known for + V-ing/noun.   *Vocabulary: Meticulous = very careful and precise."},{"q":"He was [u]reluctant[/u] to accept the new position because it required moving to another city.","o":["determined","unwilling","proud","excited"],"a":1,"e":"Form: Subject + be reluctant to + V1.   *Vocabulary: Reluctant = unwilling or hesitant."},{"q":"The [u]diligent[/u] student finished all her [u]assignments[/u] a week before the deadline.","o":["shy","careless","hardworking","forgetful"],"a":2,"e":"Form: Adjective + noun.   *Vocabulary: Diligent = hardworking and careful."},{"q":"His answer was so [u]ambiguous[/u] that no one could tell if he agreed or disagreed.","o":["rude","unclear","lengthy","certain"],"a":0,"e":"Form: So + adjective + that + clause.  *Vocabulary: Ambiguous = unclear or having more than one possible meaning. "},{"q":"Smartphone use has become extremely [u]prevalent [/u]among teenagers in the past decade.","o":["forbidden","expensive","widespread","rare"],"a":2,"e":"Form: Subject + have/has become + adjective.  *Vocabulary: Prevalent = widespread or common."},{"q":"In her [u]candid[/u] interview, the actress spoke honestly about her struggles with fame.","o":["frank","boring","formal","nervous"],"a":0,"e":"Form: Adjective + noun.   *Vocabulary: Candid = honest and direct."},{"q":"Despite losing everything in the fire, the family[u] remained[/u] resilient and rebuilt their home.","o":["hopeless","careless","angry","able to recover quickly"],"a":3,"e":"Form: Despite + V-ing/noun, subject + verb.   *Vocabulary: Resilient = able to recover quickly from difficulties."},{"q":"Many graduates are attracted to careers in finance because they can be highly [u]lucrative[/u].","o":["dangerous","boring","profitable","difficult"],"a":2,"e":"Form: Subject + be + adjective.     *Vocabulary: Lucrative = producing a lot of money or profit."},{"q":"The scientist remained[u] skeptical[/u] about the new theory until more evidence was presented.","o":["doubtful","supportive","confused","excited"],"a":0,"e":"Form: Subject + remain + adjective + about + noun.    *Vocabulary: Skeptical = doubtful or unconvinced."},{"q":"The refugees survived on a[u] meager[/u] supply of food and water for several days.","o":["expensive","insufficient","abundant","fresh"],"a":1,"e":"Form: Adjective + noun.    *Vocabulary: Meager = too small or insufficient in quantity."},{"q":"The young lawyer gave an [u]eloquent[/u] speech that impressed the entire courtroom.","o":["confusing","well-spoken and fluent","short","nervous"],"a":1,"e":"Form: Adjective + noun.    *Vocabulary: [h]Eloquent[/h] = fluent, persuasive, and effective in speaking."},{"q":"The gang was [u]notorious[/u] for a string of robberies across the province.","o":["respected","unknown","infamous","admired"],"a":2,"e":"Form: Subject + be notorious for + noun/V-ing.    *Vocabulary: [h]Notorious[/h] = famous for something bad; infamous."},{"q":"Being [u]frugal[/u] with his salary, Piseth managed to save enough to buy a house within five years.","o":["careful with money","careless with money","confused about money","generous with money"],"a":0,"e":"Form: Being + adjective, subject + verb.    *Vocabulary: [h]Frugal[/h] = careful about spending money."},{"q":"Many factories replaced their [u]obsolete[/u] machines with modern, automated equipment.","o":["dangerous","outdated","valuable","expensive"],"a":1,"e":"Form: Replace + noun + with + noun.    *Vocabulary: Obsolete = outdated or no longer useful."},{"q":"Filling out the same forms every day became a [u]tedious[/u] part of his job.","o":["rewarding","boring and repetitive","confusing","exciting"],"a":1,"e":"Form: Subject + become + adjective.    *Vocabulary: Tedious = boring because it is repetitive or takes a long time."},{"q":"The manager decided to ______ the meeting until all department heads could attend.","o":["disperse","endorse","obliterate","postpone"],"a":3,"e":"Form: Decide to + V1.   *Vocabulary: [h]Postpone[/h] = delay until a later time."},{"q":"Her calm ______ helped her stay composed even during stressful situations.","o":["digression","activity","temperament","interplay"],"a":2,"e":"Form: Adjective + noun + verb.     *Vocabulary: Temperament = a person's usual emotional nature. "},{"q":"After reviewing his credentials carefully, the board decided to ______ his appointment.","o":["impede","evade","approve","enhance"],"a":2,"e":"Form: Decide to + V1 + noun.    *Vocabulary: Approve = officially accept or agree to something."},{"q":"The volunteers worked together to ______ the community garden project.","o":["immobilize","organize","equalize","memorize"],"a":1,"e":"Form: Work together to + V1.    *Form: Work together to + V1. "},{"q":"Regular exercise has a ______ effect on overall health, improving it gradually over the years.","o":["fractional ","common ","cumulative","adept "],"a":2,"e":"Form: A number of + plural noun + plural verb.    *Grammar: Subject–verb agreement."},{"q":"Ordering five desserts for two people seemed like complete ______.","o":["backlash","overkill","benchmark","axiom"],"a":1,"e":"Form: Complete + noun.    *Vocabulary: Overkill = more than is necessary or reasonable."},{"q":"Scammers often target ______ elderly people who trust strangers too easily.","o":["gullible","pensive","doleful","poignant"],"a":0,"e":"Form: Adjective + noun.   *Vocabulary: Gullible = easily tricked or deceived."},{"q":"The manager's ______ comments during the review discouraged the whole team.","o":["impartial","harsh","tangible","tactful"],"a":0,"e":"Form: Possessive noun + adjective + noun.   *Vocabulary: Harsh = severe, unkind, or unpleasant."},{"q":"Because they hadn't paid rent for months, the family was ______ from the apartment.","o":["discharged","evicted","expelled","extradited"],"a":0,"e":"Form: Subject + was/were + V3 + from + place.   *Vocabulary: Evicted = legally forced to leave a property. "},{"q":"Experts examined the painting to verify its ______ before the auction.","o":["quality","reality","validity","authenticity"],"a":3,"e":"Form: Verify + possessive adjective + noun.   *Vocabulary: Authenticity = the quality of being genuine or real."},{"q":"The nurse treated every patient with great ______, regardless of their condition.","o":["compassion","passion","devotion","humanity"],"a":0,"e":"Form: Treat + object + with + noun.   *Vocabulary: Compassion = sympathy and concern for the suffering of others."},{"q":"After a heated argument, the business partners ______ and refused to speak for months.","o":["fell off","fell about","fell out","fell away"],"a":2,"e":"Form: Fall out + with + someone.   *Vocabulary: Fall out = quarrel or have an argument with someone."},{"q":"The dove is often used as a ______ of peace around the world.","o":["frenzy","dynasty","outpost","symbol"],"a":3,"e":"Form: A + noun + of + noun.     *Symbol = something that represents an idea or concept."},{"q":"The shadow of the mountain seemed to ______ over the small village below.","o":["loom","pursue","synchronise","restore"],"a":0,"e":"Form: Seem to + V1.     *Vocabulary: [h]Loom [/h]= appear large, threatening, or dominant."},{"q":"The new headmaster ______ stricter rules about school uniforms.","o":["enforced","inculcated","disclosed","expelled"],"a":0,"e":"Form: Subject + V2 + adjective + noun.   *Vocabulary: Enforce = make people obey a rule or law."}],"k":"q","i":"📝","items":[],"t":"Part 2 — Vocabulary"},{"id":"pmv36x2gknof4a","n":"Reading","h":"","p":"Reading","tm":0,"hid":false,"qs":[{"q":"Long-distance runners often eat a large meal of pasta or rice the night before a race. This gives their muscles extra energy for the many hours of running ahead. Without this meal, runners might ______.","o":["run much faster","skip breakfast the next day","not need water during the race","run out of energy too soon"],"a":3,"e":"The passage explains that pasta or rice provides extra energy for long-distance running. Without this meal, runners might lack sufficient energy and become tired too early. The other options are not supported by the passage."},{"q":"In many mountain villages, roads are still unpaved and become very muddy during the rainy season. Trucks often get stuck, and deliveries are delayed for days. Because of this, villagers have learned to ______.","o":["stock up on supplies before the rains begin","avoid using roads permanently","travel only by air","pave the roads themselves"],"a":0,"e":"Since deliveries are delayed during the rainy season, villagers need to store enough supplies beforehand to avoid running out of essential items."},{"q":"A honeybee that finds a good source of nectar returns to the hive and performs a special dance. The other bees watch closely and then fly off in the same direction. Through this dance, the bee is able to ______.","o":["warn the hive of danger","clean the hive","share the location of food","attract a mate"],"a":2,"e":"The other bees fly in the direction indicated by the dance, showing that the bee communicates where the food source is located."},{"q":"Before refrigerators were common, people packed blocks of ice in sawdust inside wooden boxes called iceboxes. The sawdust helped slow down the melting. Even so, the ice usually ______.","o":["was replaced by electricity","turned into steam quickly","needed to be replaced every few days","never melted at all"],"a":2,"e":"Sawdust slowed the melting but could not prevent it completely, so the ice eventually melted and had to be replaced."},{"q":"Many old maps show sea monsters drawn in unexplored parts of the ocean. Mapmakers included these creatures because sailors told frightening stories about strange sightings at sea. Historians now believe that ______.","o":["the maps were completely accurate","the monsters were probably normal sea animals seen from a distance","the monsters actually existed","the sailors were lying to get attention"],"a":1,"e":"Sailors may have mistaken ordinary sea animals viewed from far away for frightening monsters, explaining why these creatures appeared on old maps."},{"q":"A person with a green thumb is known for growing plants successfully, even ones that other people struggle to keep alive. Neighbors often ask this person for advice about their gardens. This shows that having a green thumb means ______.","o":["disliking plants","painting your hand green","working outdoors all day","being skilled at gardening"],"a":3,"e":"The person grows plants successfully and gives gardening advice, so the expression a green thumb means having a natural skill for gardening."},{"q":"Museums that display old paintings often keep the rooms dim and cool. Bright light and heat can cause the colors in old paintings to fade over time. The low lighting is used mainly to ______.","o":["save money on electricity","hide paintings that are not finished","protect the paintings from damage","make the paintings look mysterious"],"a":2,"e":"Bright light and heat can cause paintings to fade. Museums use low lighting to help preserve the paintings and prevent damage."},{"q":"When astronauts first return to Earth after months in space, they often struggle to walk normally. Their muscles have grown weaker from living without gravity. For this reason, astronauts","o":["never fully recover their strength","gain muscle immediately upon landing","prefer to stay in space permanently","must exercise carefully during rehabilitation"],"a":3,"e":"Living without gravity weakens astronauts' muscles, so they need rehabilitation exercises to rebuild their strength and recover their ability to walk normally."},{"q":"What is the main point of the passage?","o":["Public libraries have changed significantly but continue to serve an important community role.","Government funding for libraries has increased steadily.","Public libraries should focus only on lending books.","Libraries are becoming completely unnecessary due to the internet."],"a":0,"e":"The passage describes how libraries have expanded their services while continuing to connect people with reliable knowledge and support their communities.","ty":"p","g":"gmv4d0cbh7izro"},{"q":"It can be inferred that before their transformation, public libraries were mainly used for ______.","o":["borrowing books and reading quietly","hosting community meetings","teaching computer skills","job searching"],"a":0,"e":"The first paragraph explicitly states that libraries were traditionally known as quiet places to borrow books and read in silence."},{"q":"The word \"warehouse\" in paragraph 1 is closest in meaning to ______.","o":["office","shop","storage place","factory"],"a":2,"e":"In this context, warehouse describes a place where books are stored. The author uses the word to contrast a traditional book-storage space with a modern community center."},{"q":"According to paragraph 2, one benefit of modern libraries for low-income people is ______.","o":["free food programs","rivate study rooms","free books to keep","free internet access"],"a":3,"e":"Paragraph 2 states that libraries provide free internet access and computer training, especially helping people who cannot afford a computer at home."},{"q":"The word \"draws\" in paragraph 2 is closest in meaning to ______.","o":["drawings","withdrawals","sketches","attractions"],"a":3,"e":"The passage says children's programs remain popular draws for families. Here, draws means things that attract people to a place or activity."},{"q":"According to paragraph 3, critics of libraries believe that ______.","o":["librarians need better training","library funding should increase","public money could be better used elsewhere","libraries should offer more workshops"],"a":2,"e":"Paragraph 3 explains that critics believe online information makes libraries less necessary and that limited public funds might be better spent on other priorities."},{"q":"The word \"patrons\" in paragraph 4 refers to ______.","o":["book authors","library employees","government officials","library users"],"a":3,"e":"The paragraph describes librarians helping patrons evaluate information they find online. In a library context, patrons are the people who use its services."},{"q":"Why does the author mention misinformation on social media in paragraph [h]4[/h]?","o":["To show why librarians' guidance is still valuable","To describe a new library service","To criticize library funding cuts","To explain why libraries closed"],"a":0,"e":"The passage explains that misinformation spreads quickly online, making librarians' ability to help people evaluate information more important."},{"q":"It can be inferred from paragraph 4 that library visit numbers ______.","o":["have dropped to almost zero","are impossible to measure","only include children","have stayed relatively high despite the internet"],"a":3,"e":"Paragraph 4 states that library visits remain high in many communities even though digital access has expanded."},{"q":"The phrase \"taken new forms\" in paragraph 4 suggests that the library's original mission ______.","o":["is illegal now","continues but in different ways","was never important","has been abandoned completely"],"a":1,"e":"The passage explains that libraries still connect people with reliable knowledge, but they now do so through additional services, including digital guidance and computer training."},{"q":"What is the author's attitude toward the future of public libraries?","o":["Indifferent","Angry","Cautiously optimistic","Very pessimistic"],"a":2,"e":"The author acknowledges funding cuts and criticism but believes libraries will continue adapting to community needs. This shows optimism while recognizing real challenges."},{"q":"Which of the following best describes the organization of the passage?","o":["A single event is described in chronological order.","change is described, followed by challenges and a response to those challenges.","definition is given followed by a list of examples.","Two opposing theories are compared and one is proven false."],"a":1,"e":"The passage first describes how libraries have changed, then discusses funding cuts and criticism, and finally presents arguments for their continuing value and future adaptation."},{"q":"Which paragraph explains an early theory about repeating patterns during the night?","o":[" A","B"," C"," D"," E","F"," G"," H"],"a":1,"e":"","ty":"p","g":"gmv4en0w8pl6gb"},{"q":"Which paragraph describes the method used to identify a specific stage of sleep?","o":[" A","B"," C"," D"," E"," F"," G"," H"],"a":2,"e":"Paragraph C describes Aserinsky's method of attaching electrodes to record eye movements and brain waves."},{"q":"Which paragraph presents a theory about the brain clearing unnecessary connections?","o":["A"," B"," C"," D"," E"," F","G"],"a":3,"e":"Paragraph D presents Tononi's synaptic homeostasis hypothesis about weakening unnecessary neural connections."},{"q":"Which paragraph contains a description of an experiment involving learning a new skill ?","o":[" A"," B"," C"," D"," E"," F"," G"," H"],"a":4,"e":"Paragraph F presents the evolutionary biologists' theory that sleep conserves energy and keeps animals safe."},{"q":"Which paragraph presents an alternative theory focused on safety and energy conservation?","o":[" A"," B"," C"," D"," E"," F","G"," H"],"a":5,"e":""},{"q":"Which paragraph discusses the health risks of not getting enough sleep?","o":[" A"," B"," C"," D"," E"," F"," G"," H"],"a":6,"e":"Paragraph G discusses health consequences of sleep deprivation such as weakened immune function."},{"q":"Sleep helps the brain remove unneeded connections formed during the day.","o":["Kleitman","Aserinsky","Tononi","Stickgold"],"a":2,"e":""},{"q":"Sleep may exist mainly to keep animals safe and conserve energy.","o":["Kleitman","Aserinsky","Tononi","Stickgold","Evolutionary biologists"],"a":4,"e":""},{"q":"A specific eye-movement stage of sleep was identified through overnight monitoring.","o":["Kleitman","Aserinsky","Tononi","Stickgold","Evolutionary biologists"],"a":1,"e":""},{"q":"Sleep occurs in repeating cycles across the night.","o":["Kleitman","Aserinsky","Tononi","Stickgold","Evolutionary biologists"],"a":0,"e":""}],"k":"q","i":"📝","items":[],"t":"Part 3 — Reading","pgs":[{"id":"gmv4d0cbh7izro","t":"[h][b]Reading Passage — The Changing Role of Public Libraries[/b][/h]","x":"\nThe Changing Role of Public Libraries\nFor much of the twentieth century, public libraries were known primarily as quiet places to borrow books and read in silence. Today, however, many libraries have transformed into lively community centers that offer far more than printed material. This shift reflects both technological change and a broader understanding of what a library can be: not just a warehouse of books, but a shared public space open to everyone regardless of income.\n\nModern libraries increasingly provide free internet access and computer training, which is especially valuable for people who cannot afford a computer at home. Many branches also host workshops on topics ranging from resume writing to coding, and some offer meeting rooms that community groups can reserve at no cost. Children's programs, such as story time and summer reading challenges, remain popular draws for families.\n\nDespite these expanded services, libraries face real challenges. Government funding for public libraries has been reduced in many regions, forcing some branches to shorten their hours or close altogether. Critics argue that libraries have become less necessary now that so much information is available instantly online, and that scarce public funds might be better spent elsewhere.\n\nLibrarians and researchers, however, point to evidence that library visits remain high in many communities, even as digital access has expanded. They argue that librarians play an increasingly important role as trusted guides who help patrons evaluate the accuracy of information they find online, at a time when misinformation spreads quickly through social media. In this sense, the library's original mission — connecting people with reliable knowledge — has not disappeared but simply taken new forms.\n\nWhether or not public libraries continue to receive strong government support, it seems clear that they will keep adapting to serve the needs of the communities around them, much as they have throughout their long history."},{"id":"gmv4en0w8pl6gb","t":"Reading Passage — Understanding Why We Sleep","x":"\nUnderstanding Why We Sleep\nA. Sleep is something every human experiences, yet scientists only began seriously investigating why we need it during the twentieth century. Early researchers were puzzled: if sleep serves no clear survival purpose, why would evolution allow animals to spend roughly a third of their lives unconscious and vulnerable to predators?\n\nB. One influential early theory came from psychologist Nathaniel Kleitman, who in the 1950s proposed that sleep occurs in repeating cycles, each lasting roughly ninety minutes. Kleitman's research team monitored volunteers overnight and noticed that brain activity shifted in predictable patterns throughout the night, moving between lighter and deeper stages of sleep.\n\nC. Building on Kleitman's work, researcher Eugene Aserinsky discovered a distinct stage of sleep in which the eyes move rapidly beneath closed eyelids. This stage, now called REM sleep, was found to be closely associated with vivid dreaming. Aserinsky's method involved attaching electrodes to sleeping volunteers and recording their eye movements and brain waves throughout the night.\n\nD. Later researchers turned their attention to the purpose of deep, non-REM sleep. Giulio Tononi proposed what is known as the synaptic homeostasis hypothesis, suggesting that deep sleep allows the brain to \"reset\" itself by weakening unnecessary neural connections formed during the day, making room for new learning the following day.\n\nE. Meanwhile, memory researcher Robert Stickgold focused specifically on the relationship between sleep and learning. Stickgold's experiments showed that people who slept after learning a new skill, such as a sequence of finger movements, performed significantly better the next day than those who stayed awake for the same number of hours. This suggested that sleep actively strengthens memories rather than simply pausing brain activity.\n\nF. Not all researchers agree on a single explanation for sleep, however. Some evolutionary biologists argue that sleep's main function is simply to conserve energy and keep animals safely hidden during hours when hunting or foraging would be inefficient or dangerous, particularly for species with poor night vision.\n\nG. Modern sleep research has also examined the health consequences of sleep deprivation. Studies consistently link insufficient sleep to weakened immune function, impaired concentration, and a higher risk of conditions such as heart disease and depression. These findings have encouraged public health officials to treat adequate sleep as a pillar of wellbeing, alongside diet and exercise.\n\nH. Despite a century of research, scientists still do not fully agree on a single, complete explanation for why humans and animals sleep. What is clear is that sleep is not simply \"downtime\" but an active biological process essential for memory, health, and the proper functioning of the brain."}]}]},{"id":"v","n":"2018","i":"📚","t":"វិញ្ញាសាប្រលងចូល IFL-2018","h":"Choose the word or phrase closest in meaning.","k":"q","p":"","qs":[],"tm":0,"parts":[{"id":"pmv36unk1g2ofp","n":"I. Grammar","h":"Choose the correct answer.","p":"","tm":0,"hid":false,"qs":[{"q":"Sonthormok Primary School ______ up an English language program into its curriculum at the beginning of next academic year.","o":["have put","puts","is putting","has put"],"a":2,"e":"The sentence refers to a planned future arrangement. The Present Continuous can describe future plans. Option D is also incorrect because the singular subject Sonthormok Primary School takes has, not have.\nForm: Subject + am/is/are + V-ing.","img":""},{"q":"Vireak ______ his parents sell fish-ball noodles since he was seven.","o":["had helped","helped","helps","has been helping"],"a":3,"e":"Grammar: Present Perfect Continuous.  *The word since introduces the starting point of an action that began in the past and continues into the present."},{"q":"\"Sopheak, our plane ______ in twenty minutes. Let's hurry.\"","o":["taking off","takes off","was taking off","will take off"],"a":1,"e":"Grammar: Present Simple for scheduled events.   \n*The Present Simple is commonly used for scheduled future events, such as plane departures, train arrivals, and timetables."},{"q":"\"You are late now. You ______ a motorcup instead of a taxi. The traffic was really bad.\"","o":["should have taken","must take","ought to take","should take"],"a":0,"e":"Grammar: Past advice or regret.     \n*The speaker is criticizing or expressing regret about a past decision. The person should have chosen a motorcup earlier."},{"q":"My daughter is going to take an entrance examination to the Department of English's Foundation Year Program this year. By the end of this week before the examination, she ______ 50 practice tests.","o":["completes","will have completed","has completed","will complete"],"a":0,"e":"[h]Grammar: Future Perfect Tense.   [/h]\n*The phrase by the end of this week sets a future deadline. The Future Perfect describes an action that will be completed by a particular time in the future."},{"q":"The wide range of products at AEON mall ______ many Cambodian families and foreigners to patronize the mall.","o":["has attracted","attracts","are attracting","have attracted"],"a":0,"e":"Grammar: Subject–verb agreement.\n* The subject is the wide range, which is singular. The Present Simple describes a general fact or recurring effect. Therefore, attracts is correct."},{"q":"Neither of these hairstyles in this salon ______ you. Why don't you choose another one from another salon?","o":["suit","suits","suited","has suited"],"a":0,"e":"*Grammar: Subject–verb agreement. \n*Form: Neither of + plural noun/pronoun + singular verb.\n*In standard formal English, neither of takes a singular verb. The sentence describes the hairstyles' current suitability."},{"q":"In 1066, a bright comet ______ in the sky attracted much attention from scientists and non-scientists around the globe.","o":["was appearing","appears","it appeared","appearing"],"a":3,"e":"*Grammar: Present participle modifying a noun.\n*The participle appearing describes the comet and acts as a reduced relative clause: “a bright comet that appeared in the sky.” Option C would create an ungrammatical structure because it adds a separate subject and verb inside the noun phrase."},{"q":"Having become more complicated, ______ mechanics to be better trained than they were in the past.","o":["it requires","requiring","cars require","they require"],"a":2,"e":"*Form: Having + V3, subject + verb.\n*Grammar: Perfect participle phrase. \n*The sentence needs a subject that matches the introductory phrase Having become more complicated. Cars are the things that have become more complicated, and cars require better-trained mechanics. "},{"q":"\"We went on a picnic in the community park last weekend. We saw ______ colorful bird, and my father said that ______ bird was a rare species.\"","o":["a/the","the/a","a/a","the/a"],"a":0,"e":"*Form: A/an + noun (first mention); the + noun (specific or previously mentioned).\n*Grammar: Indefinite and definite articles.\n*Use a when mentioning a singular countable noun for the first time. Use the when referring to that same bird again because it is now identifiable."},{"q":"\"We have to eat in ______ hour or we will be late for ______ show.\"","o":["a/the","an/the","an/the","the/the"],"a":1,"e":"Form: An + vowel sound; the + specific noun.    *Grammar: Articles. \n*Hour begins with a vowel sound because the h is silent, so we use an. The show refers to a particular show that the speakers intend to attend."},{"q":"12. \"______ of what is tested in this English proficiency test did not make ______ sense to me.\"","o":["Much/any","More/much","Many/any","Any/much"],"a":0,"e":"*Form: Much of + uncountable noun/uncountable idea; negative verb + any + noun.\n*Grammar: Quantifiers. \n*Much is used with the uncountable noun what in the sense of “much of the material.” In a negative sentence, any sense is a natural expression: “did not make any sense to me.”"},{"q":"\"You know who broke the window yesterday, ______?\"","o":["do you","don't you","did you","didn't you"],"a":1,"e":"*Form: Positive statement + negative question tag.\n*Grammar: Question tags. \n*The main clause is You know, which is positive and in the Present Simple. Its question tag therefore uses the negative auxiliary don't and the pronoun you. The embedded question about who broke the window does not determine the tag."},{"q":"The coffee latte of the Café Nisset is ______ the DMC Café.\nA. stronger than that of","o":["stronger than that of","so strong as","stronger than","strong as that of"],"a":0,"e":"*Form: Comparative adjective + than + that of + noun.\n*Grammar: Comparisons and avoiding repetition.\n*That of replaces “the coffee latte of” to avoid repeating the same noun phrase. The complete comparison is between the coffee latte at Café Nisset and the coffee latte at DMC Café."},{"q":"Imported oranges are ______ as Cambodian home-grown oranges.","o":["not sweet","not as sweet","less sweeter","not as sweeter"],"a":1,"e":"*Form: Subject + be + not as + adjective + as + noun.\n*Grammar: Comparisons of equality."},{"q":"\"The sky is so low. If it ______, we ______ cancel our dinner party tonight.\"","o":["rain/will","will rain/will","is raining/will","rains/will"],"a":3,"e":"*Form: If + Present Simple, subject + will + V1.\n*Grammar: First Conditional."},{"q":"My family has already organized our holiday trip abroad. If my examination schedule ______ in the same week, I ______ them.","o":["did not fall/would join","do not fall/will join","has not fallen/will join","had not fallen/would have joined"],"a":1,"e":"The sentence describes a possible future situation. The First Conditional uses the Present Simple in the if-clause and will + V1 in the main clause. However, because the subject is my examination schedule, the grammatically correct wording should be “If my examination schedule does not fall in the same week, I will join them.” None of the options gives the fully correct form. B has the correct conditional pattern but the wrong subject–verb agreement.\n\n*Form: If + Present Simple, subject + will + V1.\n*Grammar: First Conditional and subject–verb agreement."},{"q":"After working so hard for the entrance examination, the candidates were so pleased ______ the results.","o":["at","in","on","with"],"a":3,"e":"*Form: Be pleased with + noun/pronoun. \n*Grammar: Adjective + preposition.\n*the standard expression is pleased with something, meaning satisfied or happy about a result or situation."},{"q":"Sothavy was asked to take ______ the role of class monitor and librarian by her teacher.","o":["in","on","with","from"],"a":1,"e":"*Form: Take on + responsibility/role.\n*Grammar: Phrasal verbs.\n*The phrasal verb take on means to accept a responsibility, task, or role. Sothavy was asked to accept these school responsibilities. "},{"q":"Collecting seashells was a hobby ______.","o":["which Daraseth found real pleasing to him","pursuing which Daraseth got much pleasure","that gave Daraseth a lot of pleasure doing","that gave Daraseth a great deal of pleasure"],"a":3,"e":"*Form: Noun + that + verb + object.\n*Grammar: Defining relative clause. \n[h]*The relative clause that gave Daraseth a great deal of pleasure correctly explains the hobby. The phrase a great deal of pleasure is grammatically natural for expressing enjoyment.[/h]"},{"q":"A scientific observer of wildlife must note every detail of how ______ in their environment: their eating and sleeping habits, their social relationships, and their methods of self-protection.","o":["live animals","do animals live","do live animals","animals live"],"a":3,"e":"*Form: How + subject + verb.\n*Grammar: Embedded or indirect questions."},{"q":"\"Samphorspheak nearly always wins the debate contest.\" \"That's because her arguments are ______.\"","o":["extremely presented well","presented well extremely","extremely well presented","well presented extremely"],"a":2,"e":"*Form: Be + adverb + adverb + V3.\n*Grammar: Adverb placement in the passive voice.\n*Well presented describes how the arguments are delivered, while extremely modifies well presented. This is the natural word order for the sentence."},{"q":"\"Sothearn will tutor you in math and English ______ you promise to do everything he says.\"\n\n\n\n","o":["unless","only if","whereas"," even though"],"a":1,"e":"*Form: Main clause + only if + subject + verb.\n*Grammar: Conditional conjunctions.\n*Only if expresses a necessary condition. Sothearn will tutor the person on the condition that they promise to do what he says."},{"q":"None of us could agree on where to go on vacation, so we went to different places, ______.\nA. \nB. \nC. \nD. ","o":["they to Siem Reap and I to Ratanakiri provinces","them to Siem Reap and me to Ratanakiri provinces","them for Siem Reap and me for Ratanakiri provinces","me to Ratanakiri and them to Siem Reap provinces"],"a":3,"e":"*Form: Subject + verb + place, with supplementary information.\n*Grammar: Parallel structure and pronoun case.\n*Option D uses object pronouns (me and them) in a supplementary phrase explaining where the people went. However, the question is awkwardly worded, and option D is not perfectly natural. A clearer version would be: “Some went to Siem Reap, and I went to Ratanakiri.”"},{"q":"The new washing machine in our house saves us a lot of budget, energy and ______.","o":["some time","any time","the time"," time"],"a":3,"e":"Form: Save + noun + and + noun + and + noun.\nGrammar: Parallel structure and zero article.\n*The verb saves is followed by three coordinated items: budget, energy, and time. The uncountable noun time is used without an article when speaking generally."},{"q":"Nearly all trees have seeds that fall to the earth, take root, and eventually ______.","o":["generate new seeds"," new seeds generate"," by generating new seeds","new seeds generate there"],"a":0,"e":"*Form: Subject + V1 + and + V1 + and + V1.\n*Grammar: Parallel verb structure."},{"q":"______ questions in this English proficiency test are not difficult.","o":["Our first few short grammar","Our few first grammar short","Our few first short grammar","Few our first grammar short"],"a":0,"e":"Why: The expected adjective order is possessive determiner (our), ordinal (first), quantity (few), and descriptive adjectives (short grammar). However, the wording is unnatural because grammar questions is the usual noun phrase. A more natural sentence would be: “Our first few short grammar questions are not difficult.”\n\n*Form: Possessive + ordinal + quantity + adjective + noun.\n*Grammar: Adjective order and noun phrases."},{"q":"\"Let's go ahead and do it now. Nothing ______ by waiting.\"\nA. \nB. \nC. \nD. ","o":["accomplishes","will be accomplished","has accomplished","accomplished"],"a":1,"e":"*Form: Subject + will be + V3.\n*Grammar: Future Simple Passive."},{"q":"\"I have begun a new construction project of Borei Mittapheap, but I have been so busy lately. Therefore, I must have a person ______ them build the houses.\"\n","o":[" is seeing"," to see","see","Option D"],"a":2,"e":"*Form: Subject + have + person + V1.\n*Grammar: Causative have."},{"q":"Sokphirsath said he had spent many hours in the café in the last few weeks completing his research thesis. Only in this way ______ the deadline.\nA. \nB. h","o":["did he meet","could he meet"," could meet"," he met"],"a":1,"e":"*Form: Only + phrase + auxiliary/modal + subject + V1.\n*Grammar: Inversion after a limiting expression.\n*When a sentence begins with the limiting expression only in this way, inversion is used in the main clause. The modal verb could comes before the subject he."},{"q":"Along the Russian Federation Boulevard ______ the Royal University of Phnom Penh, the first long existing and outstanding public university of Cambodia.","o":[" stands","stand","is standing","does stand"],"a":0,"e":"*Form: Place expression + singular verb + singular subject.\n *Grammar: Inversion with place expressions.\nWhen a sentence begins with a place expression, the verb can come before the subject for emphasis or descriptive effect. The Royal University of Phnom Penh is singular, so the singular verb stands is correct.\n"},{"q":"\"If everyone ______ each other, how would we control air traffic? Surely, we'd all be crashing into each other.\"","o":["can fly","will fly"," could fly"," flies"],"a":2,"e":"Form: If + subject + past-form verb, subject + would + V1.\n*Grammar: Second Conditional.\n"},{"q":"\"When my lost briefcase was returned with my year-long research results intact, I felt tremendously relieved. It was as if a huge, heavy weight ______ from my shoulders.\"","o":[" is lifting"," had been lifted"," is being lifted","would be lifted"],"a":1,"e":"*Form: Subject + had been + V3.\n*Grammar: Past Perfect Passive."},{"q":"34. Keyly gave such a wonderful speech at the school orientation that I couldn't resist ______ when she finished.\n","o":["to be applauded","to applaud","being applauded","A. applau /* ===== Quick / Paragraph question modes ===== */
function pgOf(leaf,id){return id?(leaf.pgs||[]).find(p=>p.id===id):null}
function pgGc(leaf){if(!leaf||!leaf.pgs)return;const u=new Set(leaf.qs.map(q=>q.g).filter(Boolean));leaf.pgs=leaf.pgs.filter(p=>u.has(p.id)||p.keep);if(!leaf.pgs.length)delete leaf.pgs}
function pgCopy(src,dst,qs){qs.forEach(q=>{if(!q.g)return;const p=pgOf(src,q.g);if(!p){delete q.g;delete q.ty;return}dst.pgs=dst.pgs||[];if(!dst.pgs.some(x=>x.id===p.id))dst.pgs.push(JSON.parse(JSON.stringify(p)));})}
function pgNew(leaf){leaf.pgs=leaf.pgs||[];const p={id:'g'+rid(),t:'',x:'',keep:1};leaf.pgs.push(p);return p}
function addQP(si,g){const l=lf(si),qs=l.qs;let id=g;if(!id){const last=qs[qs.length-1];id=last&&last.g&&pgOf(l,last.g)?last.g:pgNew(l).id}
 const p=pgOf(l,id);if(p)delete p.keep;qs.push({q:'New question',o:['Option A','Option B','Option C','Option D'],a:0,e:'',ty:'p',g:id});save();render()}
function qType(si,i,v){const l=lf(si),q=l.qs[i];if(!q)return;if(v==='p'){q.ty='p';if(!q.g||!pgOf(l,q.g)){const pv=l.qs[i-1],nx=l.qs[i+1];const id=pv&&pv.g&&pgOf(l,pv.g)?pv.g:(nx&&nx.g&&pgOf(l,nx.g)?nx.g:pgNew(l).id);q.g=id;const p=pgOf(l,id);if(p)delete p.keep}}else{delete q.ty;delete q.g;pgGc(l)}save();render()}
function qPg(si,i,v){const l=lf(si),q=l.qs[i];if(!q)return;if(v==='new'){const p=pgNew(l);delete p.keep;q.g=p.id}else if(pgOf(l,v))q.g=v;q.ty='p';pgGc(l);save();render()}
function pgSet(si,id,k,v){const p=pgOf(lf(si),id);if(p){p[k]=v;save()}}
function pgGrow(el){el.style.height='auto';el.style.height=Math.max(300,el.scrollHeight+4)+'px'}
function pgLive(el,pid){pgGrow(el);const d=document.getElementById(pid);if(d)d.innerHTML=pgHtml(el.value)||'<span class="hint">Nothing to preview yet.</span>'}
function pgRun(qs,i){const g=qs[i]&&qs[i].g;if(!g)return[i,i];let a=i,b=i;while(a>0&&qs[a-1].g===g)a--;while(b<qs.length-1&&qs[b+1].g===g)b++;return[a,b]}
function pgLabel(a,b){return a===b?'Question '+(a+1):'Questions '+(a+1)+'–'+(b+1)}
function pgBlock(leaf,qs,i){const q=qs[i],p=q&&q.g?pgOf(leaf,q.g):null;if(!p||(!p.x&&!p.t))return '';const[a,b]=pgRun(qs,i);
 return `<div class="pgrange">📖 ${pgLabel(a,b)}${p.t?' · '+esc(nm(p.t)):''}</div><article class="pgread" aria-label="Reading passage">${pgHtml(p.x,p.t)}</article>`}
function pgEdit(t,leaf,si,qs,i){const q=qs[i],p=pgOf(leaf,q.g);if(!p)return '';const[a,b]=pgRun(qs,i),n=b-a+1,pid='pgv'+p.id,rows=Math.max(12,String(p.x||'').split('\n').length+3);
 return `<div class="pgedit"><div class="pgrange">📖 Shared passage · ${pgLabel(a,b)} <small>(${n} question${n>1?'s':''} use this passage)</small></div>
 <input class="f" placeholder="Passage title (optional)" value="${esc(p.t)}" onchange="pgSet('${si}','${p.id}','t',this.value)">
 <textarea class="f pgta" rows="${rows}" placeholder="Paste or type the long passage here. Blank lines start a new paragraph; single line breaks are kept." oninput="pgLive(this,'${pid}')" onchange="pgSet('${si}','${p.id}','x',this.value)">${esc(p.x)}</textarea>
 <details class="pgprev" open><summary>👁 Preview as candidate sees it</summary><article class="pgread" id="${pid}">${pgHtml(p.x)||'<span class="hint">Nothing to preview yet.</span>'}</article></details>

function qTypeRow(si,i,q,leaf){const isP=q.ty==='p'&&q.g;const opts=(leaf.pgs||[]).map((p,k)=>`<option value="${p.id}" ${q.g===p.id?'selected':''}>Passage ${k+1}${p.t?' — '+esc(p.t).slice(0,40):(p.x?' — '+esc(p.x.slice(0,30)):'')}</option>`).join('');

function clBegin(t,s,a){if(!clUser()||a.cid||CLP.has(a))return Promise.resolve();CLP.add(a);

const pvDB=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('ifl_pv',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const pvPut=async(k,b)=>{const db=await pvDB();return new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(b,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const pvGet=async k=>{const db=await pvDB();return new Promise((res,rej)=>{const r=db.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};

function pvA4(file,cb){if(!/^image\/(png|jpeg|webp)$/.test(file.type)){pv.err='Please choose a PNG, JPG or WebP image.';render();return}
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const W=600,H=849,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingQuality='high';
  const fill=pv.fill=='fill',kf=Math.max(W/im.width,H/im.height),kt=Math.min(W/im.width,H/im.height);
  x.fillStyle='#eef2f7';x.fillRect(0,0,W,H);
  if(fill){x.drawImage(im,(W-im.width*kf)/2,(H-im.height*kf)/2,im.width*kf,im.height*kf)}
  else{try{x.filter='blur(22px) brightness(.92)'}catch(e){}x.drawImage(im,(W-im.width*kf)/2,(H-im.height*kf)/2,im.width*kf,im.height*kf);x.filter='none';x.fillStyle='rgba(255,255,255,.18)';x.fillRect(0,0,W,H);x.drawImage(im,(W-im.width*kt)/2,(H-im.height*kt)/2,im.width*kt,im.height*kt)}
  cb(c.toDataURL('image/jpeg',.88))};im.src=r.result};r.readAsDataURL(file)}
function pvImg(file,max,cb){if(!/^image\/(png|jpeg|webp)$/.test(file.type)){pv.err='Please choose a PNG, JPG or WebP image.';render();return}
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(file)}

 const h={apikey:PLC.SUPABASE_ANON_KEY,Authorization:'Bearer '+(PL.sess?PL.sess.access_token:PLC.SUPABASE_ANON_KEY),...(o.headers||{})};
 if(o.body&&!(o.body instanceof Blob))h['Content-Type']='application/json';
 const r=await fetch(plU(path),{method:o.method||'GET',headers:h,body:o.body instanceof Blob?o.body:o.body?JSON.stringify(o.body):undefined});
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){if(PL.sess&&!path.startsWith('/auth/')&&/not_authenticated/.test(String((j&&(j.message||j.msg||j.error))||''))){if(!o._r&&await clRefresh())return plFetch(path,Object.assign({},o,{_r:1}));v17Ended();throw new Error('not_authenticated')}

async function plUpload(bucket,path,file,ctype){
 return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST',plU('/storage/v1/object/'+bucket+'/'+path.split('/').map(encodeURIComponent).join('/')));
  x.setRequestHeader('apikey',PLC.SUPABASE_ANON_KEY);x.setRequestHeader('Authorization','Bearer '+PL.sess.access_token);x.setRequestHeader('x-upsert','true');x.setRequestHeader('Content-Type',ctype||file.type||'application/octet-stream');
  x.upload.onprogress=e=>{if(e.lengthComputable){PL.up=Math.round(e.loaded/e.total*100)+'%';const n=document.getElementById('plprog');if(n)n.textContent='Uploading '+PL.up}};
  x.onload=()=>{if(x.status<300)return res(path);let m='Upload failed ('+x.status+')';try{m=JSON.parse(x.responseText).message||m}catch(e){}rej(new Error(m))};
  x.onerror=()=>rej(new Error('Network error during upload'));x.send(file)})}

function plA4(file,mode){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('Could not read the cover image'));r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Could not read the cover image'));im.onload=()=>{const W=600,H=849,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingQuality='high';
  const kf=Math.max(W/im.width,H/im.height),kt=Math.min(W/im.width,H/im.height);x.fillStyle='#eef2f7';x.fillRect(0,0,W,H);
  if(mode=='fill'){x.drawImage(im,(W-im.width*kf)/2,(H-im.height*kf)/2,im.width*kf,im.height*kf)}
  else{try{x.filter='blur(22px) brightness(.92)'}catch(e){}x.drawImage(im,(W-im.width*kf)/2,(H-im.height*kf)/2,im.width*kf,im.height*kf);x.filter='none';x.fillStyle='rgba(255,255,255,.18)';x.fillRect(0,0,W,H);x.drawImage(im,(W-im.width*kt)/2,(H-im.height*kt)/2,im.width*kt,im.height*kt)}
  c.toBlob(b=>b?res(new File([b],'cover.jpg',{type:'image/jpeg'})):rej(new Error('Cover conversion failed')),'image/jpeg',.88)};im.src=r.result};r.readAsDataURL(file)})}

   Secrets never appear here: SMS / email providers live in the "account-recovery" Edge Function. */
const V17={adm:false,m:null,ph:{step:'',phone:'',err:'',busy:false,ok:''},pw:{err:'',ok:'',busy:false}};
const FP={step:'',mode:'email',err:'',busy:false,phone:'',purpose:'reset',codeLen:6,grant:'',rc:null,hint:'',em:''};
Object.assign(clE,{daily_limit_reached:'Your free practice time for today is used up.',mfa_required:'This area needs your two-step verification code. Sign in again and enter the code from your authenticator app.',cancelled:'Sign-in cancelled.',weak_password:'Choose a stronger password: at least 8 characters, not a common password.',invalid_password:'Choose a stronger password: at least 8 characters, not a common password.'});
const v17Tz=()=>{const z=(CL.cfg&&CL.cfg.tz)||'Asia/Phnom_Penh';try{new Intl.DateTimeFormat('en',{timeZone:z});return z}catch(e){return 'Asia/Phnom_Penh'}};
const v17Mins=s=>{s=Math.max(0,Math.round(+s||0));return Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s'};

/* ---------- small helpers ---------- */
async function v17Auth(path,o,token){o=o||{};const r=await fetch(plU(path),{method:o.method||'GET',headers:Object.assign({apikey:PLC.SUPABASE_ANON_KEY,Authorization:'Bearer '+(token||PLC.SUPABASE_ANON_KEY)},o.body?{'Content-Type':'application/json'}:{}),body:o.body?JSON.stringify(o.body):undefined});
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.error_description||j.msg||j.error))||('HTTP '+r.status));return j}
async function v17Fn(body,token){let r;
 try{r=await fetch(plU('/functions/v1/account-recovery'),{method:'POST',headers:{apikey:PLC.SUPABASE_ANON_KEY,Authorization:'Bearer '+(token||PLC.SUPABASE_ANON_KEY),'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){return{status:0,j:{ok:false,error:'network'}}}
 let j=null;try{j=await r.json()}catch(e){}return{status:r.status,j:j||{ok:false}}}
function v17Logout(scope){try{const t=PL.sess&&PL.sess.access_token;if(t&&plOn())fetch(plU('/auth/v1/logout'+(scope?'?scope='+scope:'')),{method:'POST',headers:{apikey:PLC.SUPABASE_ANON_KEY,Authorization:'Bearer '+t},keepalive:true}).catch(()=>{})}catch(e){}}
const v17Weak=new Set(['password','password1','12345678','123456789','1234567890','11111111','00000000','qwertyui','qwerty123','iloveyou','abc12345','1q2w3e4r','admin123','letmein1','12341234','987654321','exam1234','examcenter']);
function v17PwCheck(p,c){if(typeof p!=='string'||p.length<8)return 'Password must be at least 8 characters.';if(p.length>128)return 'Password is too long (128 characters at most).';if(/^(.)\1+$/.test(p)||v17Weak.has(p.toLowerCase()))return 'That password is too easy to guess. Choose another.';if(c!==undefined&&p!==c)return 'The two passwords do not match.';return ''}
/* Same rules as the server's phone.ts (structural check; the SMS provider is the final judge). Cambodia (+855) only. */
function v17Phone(input){const K='០១២៣៤៥៦៧៨៩',A='٠١٢٣٤٥٦٧٨٩';if(typeof input!=='string')return{ok:false,error:'invalid_phone'};
 let s=input.normalize('NFKC').trim().split('').map(ch=>{const k=K.indexOf(ch),a=A.indexOf(ch);return k>=0?String(k):a>=0?String(a):ch}).join('');
 if(!s||s.length>32)return{ok:false,error:'invalid_phone'};s=s.replace(/[\s\-.()​ ]/g,'');if(!/^\+?[0-9]+$/.test(s))return{ok:false,error:'invalid_phone'};
 const plus=s[0]==='+';let d=s.replace(/\D/g,''),n;
 if(plus){if(d.startsWith('855'))n=d.slice(3);else return{ok:false,error:'unsupported_country'}}
 else if(d.startsWith('00')){if(d.startsWith('00855'))n=d.slice(5);else return{ok:false,error:'unsupported_country'}}
 else if(d.startsWith('855')&&d.length>=11)n=d.slice(3);else if(d.startsWith('0'))n=d.slice(1);else n=d;
 if(n.startsWith('0'))n=n.slice(1);if(!/^[0-9]{8,9}$/.test(n)||!/^[13-9]/.test(n)||/^(\d)\1+$/.test(n))return{ok:false,error:'invalid_phone'};
 return{ok:true,e164:'+855'+n,national:'0'+n}}
const v17PhErr=e=>e==='unsupported_country'?'Only Cambodian numbers (+855) can be used for text-message recovery.':'Enter a valid Cambodian mobile number, for example 012 345 678 or +855 12 345 678.';
function v17FnErr(r){const e=r.j&&r.j.error;
 if(r.status===0||e==='network')return 'Could not reach the server. Check your internet connection and try again.';
 if(r.status===404)return 'The recovery service is not installed on this website yet. Please contact the administrator.';
 return {sms_not_configured:'Text-message recovery is not switched on for this website yet. Use email recovery, or contact the administrator.',sms_busy:'Text messages are temporarily unavailable. Please try again later or use email.',too_many_requests:'Too many attempts. Please wait a while and try again.',invalid_email:'Enter a valid email address.',invalid_phone:v17PhErr('invalid_phone'),unsupported_country:v17PhErr('unsupported_country'),invalid_code:'That code is not correct or has expired.',weak_password:clE.weak_password,invalid_password:clE.weak_password,invalid_or_expired:'This reset has expired or was already used. Please start again.',invalid_grant:'This reset has expired or was already used. Please start again.',reset_failed:'The password could not be changed. Please try again.',not_authenticated:clE.not_authenticated,forbidden:clE.forbidden}[e]||'Something went wrong. Please try again.'}

/* ---------- two-step (TOTP) sign-in: the 6-digit code is checked by Supabase Auth ---------- */
const v17Factors=s=>((s&&s.user&&s.user.factors)||[]).filter(f=>f.factor_type==='totp'&&f.status==='verified');
async function v17VerifyCode(token,fid,code){const ch=await v17Auth('/auth/v1/factors/'+encodeURIComponent(fid)+'/challenge',{method:'POST',body:{}},token);
 return v17Auth('/auth/v1/factors/'+encodeURIComponent(fid)+'/verify',{method:'POST',body:{challenge_id:ch.id,code:String(code).replace(/\s/g,'')}},token)}
function v17Gate(j){const f=v17Factors(j)[0];if(!f)return j;return v17Totp(j,f.id)}
function v17Totp(sess,fid,title){return new Promise((res,rej)=>{const o=document.createElement('div');o.className='mdl';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Two-step verification');
 o.innerHTML=`<div class="mdc"><h3>${esc(title||'Two-step verification')}</h3><p>Open your authenticator app and enter the 6-digit code for this website.</p><input class="f" id="v17c" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123456" aria-label="6-digit code"><div class="ferr" id="v17ce" role="alert"></div><div class="mda"><button class="btn ghost" id="v17x">Cancel</button><button class="btn g" id="v17y">Verify</button></div></div>`;
 document.body.appendChild(o);const inp=o.querySelector('#v17c'),er=o.querySelector('#v17ce'),ok=o.querySelector('#v17y');inp.focus();
 const done=()=>o.remove();o.querySelector('#v17x').onclick=()=>{done();rej(new Error('cancelled'))};
 const go=async()=>{const c=inp.value.replace(/\s/g,'');if(!/^[0-9]{6}$/.test(c)){er.textContent='Enter the 6 digits from your app.';return}
  ok.disabled=true;er.textContent='';try{const v=await v17VerifyCode(sess.access_token,fid,c);done();res(Object.assign({},sess,v,{user:v.user||sess.user}))}catch(e){ok.disabled=false;er.textContent=/rate|too many|limit/i.test(String(e.message))?'Too many attempts. Wait a minute and try again.':'That code is not correct. Check the time on your phone and try again.';inp.select()}};
 ok.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()})})}
/* enrolment (administrators are required to; members may) */
async function v17Enroll(){V17.m={step:'enroll',busy:true,err:''};render();
 try{const f=await v17Auth('/auth/v1/factors',{method:'POST',body:{factor_type:'totp',friendly_name:'epc-'+Math.random().toString(36).slice(2,8)}},PL.sess.access_token);
  const svg=String((f.totp&&f.totp.qr_code)||''),i=svg.indexOf(',');const src=svg.startsWith('data:image/svg+xml')&&i>0?'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(decodeURIComponent(svg.slice(i+1))):'';
  V17.m={step:'enroll',id:f.id,secret:(f.totp&&f.totp.secret)||'',qr:src,err:''}}catch(e){V17.m={step:'',err:clMsg(e)}}render()}
async function v17Confirm(){const c=((document.getElementById('v17ec')||{}).value||V17.code||'').replace(/\s/g,'');if(!V17.m||!V17.m.id)return;if(!/^[0-9]{6}$/.test(c)){V17.m.err='Enter the 6 digits shown in your app.';render();return}
 V17.m.busy=true;V17.m.err='';render();
 try{const v=await v17VerifyCode(PL.sess.access_token,V17.m.id,c);PL.sess=Object.assign({},PL.sess,v,{user:v.user||PL.sess.user});plSaveSess();V17.m=null;V17.code='';DS.err='';
  if(view=='dash')await dsInit();else{try{await clAcctLoad()}catch(e){}}}catch(e){V17.m.busy=false;V17.m.err='That code is not correct. Check the time on your phone and try again.'}render()}
function v17EnrollCard(){const m=V17.m||{};
 if(m.step==='enroll'&&m.id)return `<div class="dsh-fa" style="display:block">${m.qr?`<img src="${esc(m.qr)}" alt="QR code for your authenticator app" width="180" height="180" style="background:#fff;border-radius:8px;padding:6px">`:''}<div class="hint">Scan the QR code with Google Authenticator, Microsoft Authenticator, Authy or a similar app. Cannot scan? Enter this key by hand:<br><code style="user-select:all;word-break:break-all">${esc(m.secret)}</code></div><label class="lb" for="v17ec">6-digit code from the app</label><input class="f" id="v17ec" inputmode="numeric" autocomplete="one-time-code" maxlength="7" style="max-width:200px" value="${esc(V17.code||'')}" oninput="V17.code=this.value" onkeydown="if(event.key=='Enter')v17Confirm()"><div class="ferr" role="alert">${esc(m.err||'')}</div><button class="btn g" ${m.busy?'disabled':''} onclick="v17Confirm()">${m.busy?'Checking…':'Turn on two-step verification'}</button> <button class="btn ghost" onclick="V17.m=null;render()">Cancel</button></div>`;
 return `${m.err?`<div class="ferr" role="alert">${esc(m.err)}</div>`:''}<button class="btn g" ${m.busy?'disabled':''} onclick="v17Enroll()">${m.busy?'Please wait…':'Set up an authenticator app'}</button>`}
/* the administrator gate: shown when a listed administrator signed in without a two-step code */
function v17MfaGate(){const w=DS.who;if(!PL.sess||!w||!w.is_admin||w.ok)return '';
 const body=w.mfa_enrolled?`<div class="hint">Enter the 6-digit code from your authenticator app to open the dashboard.</div><div class="dsh-fa"><button class="btn g" onclick="v17StepUp()">Enter code</button> <button class="btn ghost" onclick="plOut();view='dash';render()">Sign out</button></div>`
  :`<div class="hint">Administrator accounts must use two-step verification. Set up an authenticator app now; it takes a minute.</div>${v17EnrollCard()}<div class="dsh-fa"><button class="btn ghost" onclick="plOut();view='dash';render()">Sign out</button></div>`;
 return `<div class="card" style="max-width:520px;margin:18px auto"><h2 style="margin:0 0 4px">Two-step verification required</h2>${body}</div>`}
async function v17StepUp(){try{const u=await v17Auth('/auth/v1/user',{},PL.sess.access_token);const f=(u.factors||[]).find(x=>x.factor_type==='totp'&&x.status==='verified');if(!f){DS.who.mfa_enrolled=false;render();return}
  const s=await v17Totp(PL.sess,f.id,'Administrator two-step code');PL.sess=Object.assign({},PL.sess,s);plSaveSess();await dsInit();render()}catch(e){if(!/cancelled/.test(String(e.message))){DS.err=clMsg(e);render()}}}

/* ---------- forgot password / forgot username ---------- */
function fpOpen(mode){FP.step=mode==='user'?'user':'';FP.mode=mode==='phone'?'phone':'email';FP.err='';FP.grant='';FP.hint='';scr='fp';msg='';render();scrollTo(0,0)}
function fpBack(){FP.step='';FP.err='';FP.grant='';FP.rc=null;scr='';msg='';render()}
function fpMode(m){FP.mode=m;FP.err='';render()}
const fpE=m=>{FP.err=m;snd('err');const e=document.getElementById('fpe');if(e)e.textContent=m};
function fpBusy(on,id,label){FP.busy=on;const b=document.getElementById(id);if(b){b.disabled=on;b.textContent=on?'Please wait…':label}}
async function fpEmail(){const em=((document.getElementById('fpem')||{}).value||'').trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)||em.length>254)return fpE('Enter a valid email address.');
 fpBusy(true,'fpgo','Send reset link');let r=await v17Fn({action:'email_start',email:em});
 if(r.status===404||r.status===0){try{await v17Auth('/auth/v1/recover',{method:'POST',body:{email:em,redirect_to:location.origin+'/'}});r={status:200,j:{ok:true}}}catch(e){r={status:r.status,j:{ok:false,error:r.status?'':'network'}}}}   /* function missing: ask Supabase directly (its allow-list fixes the redirect) */
 fpBusy(false,'fpgo','Send reset link');
 if(r.status===200){FP.em=em;FP.step='sent';FP.err='';render();return}
 fpE(v17FnErr(r))}
async function fpPhoneStart(purpose){const p=v17Phone((document.getElementById('fpph')||{}).value||'');if(!p.ok)return fpE(v17PhErr(p.error));
 fpBusy(true,'fpgo','Send code');const r=await v17Fn({action:'phone_start',phone:p.e164,purpose});fpBusy(false,'fpgo','Send code');
 if(r.status===200&&r.j.ok){FP.phone=p.e164;FP.purpose=purpose;FP.codeLen=r.j.code_length||6;FP.step='code';FP.err='';render();return}
 fpE(v17FnErr(r))}
async function fpPhoneVerify(){const c=((document.getElementById('fpcd')||{}).value||'').replace(/\s/g,'');if(!new RegExp('^[0-9]{'+FP.codeLen+'}$').test(c))return fpE('Enter the '+FP.codeLen+'-digit code from the text message.');
 fpBusy(true,'fpgo','Check code');const r=await v17Fn({action:'phone_verify',phone:FP.phone,code:c,purpose:FP.purpose});fpBusy(false,'fpgo','Check code');
 if(r.status===200&&r.j.ok){if(FP.purpose==='lookup'){FP.hint=r.j.email_hint||'';FP.step='hint'}else{FP.grant=r.j.grant;FP.step='newpw'}FP.err='';render();return}
 fpE(v17FnErr(r))}
async function fpSetPw(){const a=(document.getElementById('fpn1')||{}).value||'',b=(document.getElementById('fpn2')||{}).value||'';const w=v17PwCheck(a,b);if(w)return fpE(w);
 fpBusy(true,'fpgo','Save new password');
 try{if(FP.rc){const tk=FP.rc;await v17Auth('/auth/v1/user',{method:'PUT',body:{password:a}},tk);
   await v17Fn({action:'notify_password_changed'},tk);                                          /* the owner gets an email notice */
   try{await v17Auth('/auth/v1/logout?scope=global',{method:'POST'},tk)}catch(e){}              /* every device is signed out, including this recovery session */
   FP.rc=null}
  else{const r=await v17Fn({action:'reset_with_grant',grant:FP.grant,new_password:a});if(!(r.status===200&&r.j.ok)){fpBusy(false,'fpgo','Save new password');return fpE(v17FnErr(r))}FP.grant=''}
  FP.step='done';FP.err='';render()}catch(e){fpBusy(false,'fpgo','Save new password');fpE(/same|different/i.test(String(e.message))?'Choose a password you have not used before.':/weak|short|least/i.test(String(e.message))?clE.weak_password:/expired|invalid|jwt|token/i.test(String(e.message))?'This reset link has expired or was already used. Request a new one.':clMsg(e))}}
function fpPw(){return `<label class="lb" for="fpn1">New password (at least 8 characters)</label>${pwBox('fpn1','New password','fpSetPw','new-password')}<label class="lb" for="fpn2">Repeat new password</label>${pwBox('fpn2','Repeat password','fpSetPw','new-password')}<div id="fpe" class="ferr" role="alert">${esc(FP.err)}</div><button id="fpgo" class="btn g wide" onclick="fpSetPw()">Save new password</button><div class="hint" style="margin-top:10px">Your membership, free-trial dates, exam attempts and scores are not changed by a password reset. Other devices are signed out.</div>`}
function fpV(){const S=FP.step,back=`<button class="btn wide ghost" onclick="fpBack()">← Back to sign in</button>`,E=`<div id="fpe" class="ferr" role="alert">${esc(FP.err)}</div>`;let h;
 if(!clOn())h=`<div class="ah">🔑</div><h2 style="text-align:center">Forgot password?</h2><div class="hint">On this website, accounts are stored on this device only, so there is no email or text-message reset. Ask your teacher or administrator to help, or create a new account with the same email.</div><div class="hint">Online accounts (with email and phone recovery) can be switched on by the administrator.</div>${back}`;
 else if(FP.rc&&S==='newpw')h=`<div class="ah">🔑</div><h2 style="text-align:center">Choose a new password</h2>${fpPw()}`;
 else if(S==='newpw')h=`<div class="ah">🔑</div><h2 style="text-align:center">Choose a new password</h2><div class="hint">Phone number verified. Set your new password.</div>${fpPw()}`;
 else if(S==='done')h=`<div class="ah">✅</div><h2 style="text-align:center">Password changed</h2><div class="hint">You can now sign in with your new password. If you did not do this, contact the administrator straight away. A notice is sent to your email when email delivery is set up.</div><button class="btn g wide" onclick="fpBack()">Sign in</button>`;
 else if(S==='sent')h=`<div class="ah">📧</div><h2 style="text-align:center">Check your email</h2><div class="hint">If a verified account exists for <b>${esc(FP.em)}</b>, a password-reset link is on its way. The link works once and expires soon. Look in your spam folder too.</div><div class="hint">No email after a few minutes? The website may not have email delivery configured yet, or that address cannot receive reset links. You can try again, use your phone number, or contact the administrator.</div><button class="btn wide ghost" onclick="FP.step='';render()">Try again</button>${back}`;
 else if(S==='code')h=`<div class="ah">💬</div><h2 style="text-align:center">Enter the code</h2><div class="hint">If this number belongs to an account, a ${FP.codeLen}-digit code was sent to <b>${esc(FP.phone)}</b>. Text messages can take a minute to arrive.</div><label class="lb" for="fpcd">Code</label><input class="f" id="fpcd" inputmode="numeric" autocomplete="one-time-code" maxlength="${FP.codeLen+1}" onkeydown="if(event.key=='Enter')fpPhoneVerify()">${E}<button id="fpgo" class="btn g wide" onclick="fpPhoneVerify()">Check code</button><button class="btn wide ghost" onclick="FP.step=FP.purpose==='lookup'?'user':'';FP.mode='phone';render()">Use a different number</button>`;
 else if(S==='hint')h=`<div class="ah">🔎</div><h2 style="text-align:center">Your sign-in email</h2><div class="hint">Your account email starts like this:</div><div style="text-align:center;font-size:22px;font-weight:800;margin:10px 0">${esc(FP.hint||'(not available)')}</div><div class="hint">Use that email address on the sign-in page. For your safety the full address is not shown.</div><button class="btn g wide" onclick="fpBack()">Go to sign in</button>`;
 else if(S==='user')h=`<div class="ah">🔎</div><h2 style="text-align:center">Forgot username or email?</h2><div class="hint">Your username is the email address you registered with. If you added a verified Cambodian phone number to your account, we can send a code to it and show a hidden hint of your email. Without a verified phone number, try the addresses you normally use, or ask the administrator.</div><label class="lb" for="fpph">Cambodian phone number</label><input class="f" id="fpph" type="tel" autocomplete="tel" placeholder="012 345 678 or +855 12 345 678" onkeydown="if(event.key=='Enter')fpPhoneStart('lookup')">${E}<button id="fpgo" class="btn g wide" onclick="fpPhoneStart('lookup')">Send code</button>${back}`;
 else h=`<div class="ah">🔑</div><h2 style="text-align:center">Forgot password? · ភ្លេចពាក្យសម្ងាត់</h2><div class="hint">Choose how to reset it. We never say whether an email or phone number is registered.</div><div class="hrow" role="tablist" style="gap:8px;margin-bottom:8px"><button role="tab" aria-selected="${FP.mode==='email'}" class="btn s ${FP.mode==='email'?'g':''}" onclick="fpMode('email')">Email</button><button role="tab" aria-selected="${FP.mode==='phone'}" class="btn s ${FP.mode==='phone'?'g':''}" onclick="fpMode('phone')">Phone (+855)</button></div>`
  +(FP.mode==='email'?`<label class="lb" for="fpem">Email</label><input class="f" id="fpem" type="email" autocomplete="email" placeholder="you@example.com" onkeydown="if(event.key=='Enter')fpEmail()">${E}<button id="fpgo" class="btn g wide" onclick="fpEmail()">Send reset link</button>`
   :`<label class="lb" for="fpph">Cambodian phone number linked to your account</label><input class="f" id="fpph" type="tel" autocomplete="tel" placeholder="012 345 678 or +855 12 345 678" onkeydown="if(event.key=='Enter')fpPhoneStart('reset')">${E}<button id="fpgo" class="btn g wide" onclick="fpPhoneStart('reset')">Send code</button><div class="hint" style="margin-top:8px">Only phone numbers you verified inside your account can be used. Text messages work for Cambodian (+855) numbers only.</div>`)
  +`<div class="or">or</div><button class="btn wide ghost" onclick="fpOpen('user')">Forgot username or email?</button>${back}`;
 return `<div class="card auth">${h}</div>`}
/* the link in the reset email opens the site with #access_token=…&type=recovery */
function v17Land(){try{const h=location.hash||'';if(!h||h.length<8)return;const p=new URLSearchParams(h.replace(/^#/,''));
  if(p.get('type')==='recovery'&&p.get('access_token')){FP.rc=p.get('access_token');FP.step='newpw';scr='fp';history.replaceState(null,'',location.pathname+location.search)}
  else if(p.get('error_code')||p.get('error_description')){FP.step='';FP.err='That link has expired or was already used. Request a new one.';FP.mode='email';scr='fp';history.replaceState(null,'',location.pathname+location.search)}}catch(e){}}

/* ---------- account security card (membership page) ---------- */
function v17AcctCards(){if(!clUser()||!PL.sess)return '';const m=CL.mem||{},u=PL.sess.user||{},P=V17.ph,W=V17.pw;
 const mfa=v17Factors(PL.sess).length>0||V17.mfaOn;
 const phone=m.phone_verified?`<div class="hrow"><span>📱 ${esc(m.phone||'')} <span class="cl-st ok">verified</span></span><button class="btn s r" onclick="arm(this,v17PhRemove)">Remove</button></div><div class="hint">Used to recover your account by text message.</div>`
  :(P.step==='code'?`<div class="hint">Enter the code sent to <b>${esc(P.phone)}</b>.</div><input class="f" id="v17pc" inputmode="numeric" autocomplete="one-time-code" maxlength="7" style="max-width:200px" value="${esc(V17.pcv||'')}" oninput="V17.pcv=this.value" onkeydown="if(event.key=='Enter')v17PhConfirm()"><div class="ferr" role="alert">${esc(P.err)}</div><button class="btn g" ${P.busy?'disabled':''} onclick="v17PhConfirm()">Verify number</button> <button class="btn ghost" onclick="V17.ph={step:'',phone:'',err:'',busy:false};render()">Cancel</button>`
